name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.diff.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: python3 -m wslbuild.changes

  gates:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install hash-pinned validation tools
        run: python3 scripts/bootstrap
      - run: python3 scripts/check gate --stage gates

  package-check:
    needs: [changes, gates]
    if: needs.changes.outputs.kind == 'product'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: integration
        name: Build and validate unsigned integration package offline
        run: |
          version=$(python3 -m wslbuild.candidate version)
          export WSL_PACKAGE_VERSION=${version:-0.1.0}
          python3 -m wslbuild.rootfs integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-integration
          path: ${{ steps.integration.outputs.directory }}/*.pkg.tar.zst
          if-no-files-found: error

  package-sign:
    needs: [changes, package-check]
    if: needs.changes.outputs.kind == 'product' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: package-signing
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-integration
          path: .cache/signed-package
      - name: Sign only; no package execution or compilation
        env:
          WSL_PACKAGE_SIGNING_KEY: ${{ secrets.WSL_PACKAGE_SIGNING_KEY }}
        run: python3 scripts/ci-sign-package .cache/signed-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-integration
          path: .cache/signed-package/*
          if-no-files-found: error

  test-package-sign:
    needs: [changes, package-check]
    if: needs.changes.outputs.kind == 'product' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-integration
          path: .cache/signed-package
      - name: Ephemeral testing credential; no production environment
        run: python3 scripts/ci-sign-package .cache/signed-package --testing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-integration
          path: .cache/signed-package/*
          if-no-files-found: error

  kernel-build:
    needs: [changes, gates, package-check]
    if: needs.changes.outputs.kind == 'product'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: kernel
        name: Verify pinned controlled-builder kernel and matching module VHDX
        run: python3 scripts/build-kernel --locked-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-files
          path: ${{ steps.kernel.outputs.directory }}/*
          if-no-files-found: error

  rootfs-build:
    needs: [changes, gates, package-check, package-sign, test-package-sign, kernel-build]
    if: >-
      always() && needs.changes.outputs.kind == 'product' && needs.gates.result == 'success' &&
      needs.package-check.result == 'success' && needs.kernel-build.result == 'success' &&
      (needs.package-sign.result == 'success' || needs.test-package-sign.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-integration
          path: .cache/signed-package
      - id: rootfs
        name: Assemble locked rootfs without signing credentials
        run: |
          args=()
          if [[ -f .cache/signed-package/testing-key.asc ]]; then
            args+=(--testing-key .cache/signed-package/testing-key.asc)
          fi
          python3 -m wslbuild.rootfs rootfs --signed-package .cache/signed-package "${args[@]}"
      - name: Real Linux setup interruption and clean-image checks
        env:
          ROOTFS_DIRECTORY: ${{ steps.rootfs.outputs.directory }}
        run: python3 scripts/check gate --stage rootfs --rootfs "$ROOTFS_DIRECTORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootfs-files
          path: |
            ${{ steps.rootfs.outputs.directory }}/rootfs.tar.zst
            ${{ steps.rootfs.outputs.directory }}/rootfs-inventory.txt
            ${{ steps.rootfs.outputs.directory }}/rootfs-inputs.json
          if-no-files-found: error

  candidate-build:
    needs: [changes, kernel-build, rootfs-build]
    if: >-
      always() && needs.changes.outputs.kind == 'product' &&
      needs.kernel-build.result == 'success' && needs.rootfs-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-files
          path: .cache/kernel-output
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs-files
          path: .cache/rootfs-output
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-integration
          path: .cache/signed-package
      - name: Assemble candidate without rebuilding
        run: >-
          python3 -m wslbuild.candidate assemble --kernel .cache/kernel-output
          --rootfs .cache/rootfs-output --package .cache/signed-package --output .cache/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-candidate
          path: .cache/candidate/*
          if-no-files-found: error

  candidate-sign:
    needs: [changes, candidate-build]
    if: needs.changes.outputs.kind == 'product' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: candidate-signing
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-candidate
          path: .cache/candidate
      - name: Sign manifest only; never execute candidate code
        env:
          WSL_MANIFEST_SIGNING_KEY: ${{ secrets.WSL_MANIFEST_SIGNING_KEY }}
        run: python3 scripts/ci-sign-candidate .cache/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/candidate/*
          if-no-files-found: error
          retention-days: 90

  acceptance-check:
    needs: [changes, gates]
    if: needs.changes.outputs.kind == 'acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact available trusted-main candidate and every scenario
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m wslbuild.candidate acceptance

  release:
    needs: [changes, acceptance-check]
    if: needs.changes.outputs.kind == 'acceptance' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    concurrency:
      group: appsynergy-wsl-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish accepted bytes without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          WSL_PACKAGE_SIGNING_KEY: ${{ secrets.WSL_PACKAGE_SIGNING_KEY }}
          WSL_MANIFEST_SIGNING_KEY: ${{ secrets.WSL_MANIFEST_SIGNING_KEY }}
        run: python3 scripts/promote

  ci-ok:
    needs: [changes, gates, package-check, package-sign, test-package-sign, kernel-build, rootfs-build, candidate-build, candidate-sign, acceptance-check, release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every expected result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: python3 scripts/ci-aggregate
